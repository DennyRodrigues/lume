services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lume
      POSTGRES_PASSWORD: lume
      POSTGRES_DB: lume
    ports: ["5432:5432"]
    volumes: ["lume-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lume -d lume"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://lume:lume@db:5432/lume?schema=public
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run db:deploy && npm run start --workspace server"
volumes:
  lume-data:
